<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Masters</title>
    <link rel="stylesheet" href="quizanswer.css">
    <script defer src="quizanswer.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Quiz Masters</h1>
            <p>Punten: <span id="totalScore">0</span></p>
        </div>
    </header>

    <main>
        <div class="quiz-container">
            <div id="question_id" class="question-card">
                <h2 id="question_text">Vraag tekst</h2>

                <div id="question_options" class="options-container">
                    <!-- opties worden door JavaScript ingeladen -->
                </div>

                <button class="submit-btn" id="submitBtn">Antwoord controleren</button>
                <div id="feedback" class="feedback"></div>
            </div>
        </div>
    </main>
</body>
</html>
